name: Remove footer orcas once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-footer-orcas-once.yml']
permissions:
  contents: write
jobs:
  remove-orcas:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Remove only the orca artwork and animation, preserving grey interests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re, urllib.request
          root = 'https://api.github.com/repos/salemscript/jackchobanian'
          def api(path, body=None):
              request = urllib.request.Request(root + path,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json',
                           'User-Agent': 'portfolio-footer-maintenance'},
                  method='GET' if body is None else 'PUT')
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          meta = api('/contents/index.html?ref=main')
          expected = 'dbd792a42782cdb7c9574d71924def3ec88b69c4'
          if meta['sha'] != expected:
              raise RuntimeError('index.html changed; stop rather than overwrite newer edits')
          blob = api('/git/blobs/' + meta['sha'])
          raw = base64.b64decode(blob['content'])
          assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == expected
          original = raw.decode('utf-8')
          styles = re.findall(r'<style id="footer-orcas-style">[\s\S]*?</style>', original)
          assert len(styles) == 1, 'Expected one orca style block'
          grey = '.interests-section .interests-list>span{border-color:#919ba5}'
          assert grey in styles[0]
          replacement = '<style id="interests-border-style">\n/* Keep neutral grey outlines on Interests in both themes. */\n' + grey + '\n</style>'
          edited = original.replace(styles[0], replacement, 1)
          matches = re.findall(r'<div id="footer-orcas" aria-hidden="true">[\s\S]*?</script>', edited)
          assert len(matches) == 1, 'Expected one orca container and its script'
          whales = matches[0]
          assert whales.count('<svg ') == 2
          assert "const cove=document.getElementById('footer-orcas');" in whales
          assert '</main>' not in whales and '<footer' not in whales and 'wafer-greeting' not in whales
          edited = edited.replace(whales, '', 1)
          assert 'footer-orca' not in edited and 'orca-sprite' not in edited
          assert grey in edited and 'Made by Jack Chobanian' in edited
          assert 'class="wafer-greeting"' in edited
          assert 0 < len(original) - len(edited) < 7000
          assert re.findall(r'<img\b[^>]*>', original) == re.findall(r'<img\b[^>]*>', edited)
          assert re.findall(r'<a\b[^>]*>', original) == re.findall(r'<a\b[^>]*>', edited)
          result = api('/contents/index.html', {
              'message': 'Remove footer orcas and their animations; keep grey Interests borders',
              'branch': 'main', 'sha': meta['sha'],
              'content': base64.b64encode(edited.encode('utf-8')).decode('ascii')})
          print('Updated index.html:', result['commit']['sha'])
          print('Removed both orcas and their animation code; footer, wafer and grey Interests unchanged.')
          PY
