name: Apply footer orcas once
on:
  push:
    branches: [main]
    paths: [.github/workflows/one-time-footer-orcas.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-time-footer-orcas
  cancel-in-progress: false
jobs:
  update-footer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply guarded HTML additions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, urllib.request
          repo = 'salemscript/jackchobanian'
          expected = '6b6b9561aa56a42fc0117c6629958a767b491860'
          api = 'https://api.github.com/repos/' + repo
          def request(path, payload=None):
              headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'}
              body = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(api + path, data=body, headers=headers, method='GET' if body is None else 'PUT')
              with urllib.request.urlopen(req, timeout=45) as response:
                  return json.load(response)
          meta = request('/contents/index.html?ref=main')
          if meta['sha'] != expected:
              raise SystemExit('Stopped: index.html changed since the reviewed version. No content was overwritten.')
          blob = request('/git/blobs/' + expected)
          if blob.get('encoding') != 'base64':
              raise SystemExit('Unexpected blob encoding; no changes made.')
          raw = base64.b64decode(blob['content'])
          actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          if actual != expected:
              raise SystemExit('Blob integrity check failed; no changes made.')
          source = raw.decode('utf-8')
          if 'id="footer-orcas"' in source:
              raise SystemExit('Orca section already exists; no duplicate inserted.')
          start = source.index('<main>')
          footer = source.index('<footer>Made by Jack Chobanian, Cal Poly Pomona, Chemical Engineering, Class of 2028</footer>', start)
          wafer = source.index('<div class="wafer-greeting">', footer)
          end = source.index('</main>', start)
          if not footer < wafer < end or '<canvas id="waferpx"' not in source[wafer:end]:
              raise SystemExit('Footer layout differs from expected; no changes made.')
          css = '''
          <style id="footer-orcas-style">
          /* Small decorative pixel orcas, below the footer and wafer. */
          #footer-orcas{position:relative;isolation:isolate;width:100%;height:112px;margin:12px auto 0!important;overflow:hidden;pointer-events:none;user-select:none;contain:layout paint}
          #footer-orcas .orca-track{position:absolute;left:0;top:16px;width:calc(100% - 96px);height:48px;animation:footer-orca-cruise 28s linear infinite;animation-delay:-4s;will-change:transform}
          #footer-orcas .orca-facing{width:96px;height:48px;animation:footer-orca-turn 28s linear infinite;animation-delay:-4s;transform-origin:center}
          #footer-orcas .orca-sprite{display:block;width:100%;height:100%;overflow:visible;image-rendering:pixelated;shape-rendering:crispEdges;animation:footer-orca-bob 3.6s ease-in-out infinite}
          #footer-orcas .orca-tail{animation:footer-orca-tail 1.2s steps(2,end) infinite}
          #footer-orcas .orca-body,#footer-orcas .orca-tail{fill:#0b1117;stroke:#88949e;stroke-width:.35;stroke-linejoin:miter}
          #footer-orcas .orca-track--two{top:66px;width:calc(100% - 72px);height:36px;animation-duration:34s;animation-delay:-24s}
          #footer-orcas .orca-track--two .orca-facing{width:72px;height:36px;animation-duration:34s;animation-delay:-24s}
          #footer-orcas .orca-track--two .orca-sprite{animation-duration:4.2s;animation-delay:-1.7s}
          #footer-orcas .orca-track--two .orca-tail{animation-delay:-.5s}
          #footer-orcas.is-paused *{animation-play-state:paused!important}
          /* Interests use neutral silver-grey outlines in both themes. */
          .interests-section .interests-list>span{border-color:#919ba5}
          @keyframes footer-orca-cruise{0%,100%{transform:translateX(0)}50%{transform:translateX(100%)}}
          @keyframes footer-orca-turn{0%,47%{transform:scaleX(1)}50%,97%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
          @keyframes footer-orca-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
          @keyframes footer-orca-tail{0%,100%{transform:translateY(-.5px)}50%{transform:translateY(.5px)}}
          @media(max-width:480px){#footer-orcas{height:96px}#footer-orcas .orca-track{width:calc(100% - 80px);height:40px;top:12px}#footer-orcas .orca-facing{width:80px;height:40px}#footer-orcas .orca-track--two{width:calc(100% - 64px);height:32px;top:56px}#footer-orcas .orca-track--two .orca-facing{width:64px;height:32px}}
          @media(prefers-reduced-motion:reduce){#footer-orcas *{animation:none!important;will-change:auto!important}#footer-orcas .orca-track{transform:translateX(18%)}#footer-orcas .orca-track--two{transform:translateX(72%)}#footer-orcas .orca-track--two .orca-facing{transform:scaleX(-1)}}
          @media print{#footer-orcas{display:none!important}}
          </style>
          '''
          sprite = '''<svg class="orca-sprite" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 24" aria-hidden="true" focusable="false">
            <path class="orca-tail" d="M11 11H7V9H4V7H1V10H3V12H6V13H3V15H1V18H4V17H7V15H11Z"/>
            <path class="orca-body" d="M9 11H13V9H19V7H22V4H24V1H26V3H27V8H32V9H37V10H40V12H43V14H44V17H42V19H38V21H29V20H23V19H18V17H13V15H9Z"/>
            <path fill="#8b97a0" d="M18 10H22V9H25V11H22V12H18Z"/>
            <path fill="#f5fbff" d="M14 14H19V16H26V17H33V18H40V17H43V18H41V19H38V20H30V19H23V18H18V16H14Z"/>
            <path fill="#f5fbff" d="M32 11H36V12H38V14H36V15H32V14H31V12H32Z"/>
            <path fill="#0b1117" d="M24 17H29V19H28V21H26V23H24V22H23V19Z"/>
            <rect x="40" y="13" width="1" height="1" fill="#e4f2fa"/>
          </svg>'''
          markup = '\n<div id="footer-orcas" aria-hidden="true">\n'
          for variant in ('', ' orca-track--two'):
              markup += '  <div class="orca-track' + variant + '"><div class="orca-facing">\n' + sprite + '\n  </div></div>\n'
          markup += '</div>\n<script>\n' + '''(function(){
            'use strict';
            const cove=document.getElementById('footer-orcas');
            if(!cove)return;
            let visible=true;
            function sync(){cove.classList.toggle('is-paused',!visible||document.hidden);}
            if('IntersectionObserver' in window){
              const observer=new IntersectionObserver(function(entries){visible=entries[0].isIntersecting;sync();});
              observer.observe(cove);
            }
            document.addEventListener('visibilitychange',sync);
            sync();
          })();''' + '\n</script>\n'
          updated = source[:end] + markup + source[end:]
          updated = updated.replace('</head>', css + '</head>', 1)
          if updated.count('id="footer-orcas"') != 1 or updated.count('class="orca-sprite"') != 2:
              raise SystemExit('Orca insertion validation failed; no changes made.')
          if updated.replace(css, '', 1).replace(markup, '', 1) != source:
              raise SystemExit('Unrelated content change detected; no changes made.')
          result = request('/contents/index.html', {'branch': 'main', 'sha': expected, 'message': 'Add two swimming pixel orcas below footer and grey Interests borders', 'content': base64.b64encode(updated.encode('utf-8')).decode('ascii')})
          print('Updated index.html:', result['commit']['sha'])
          print('Original content preserved; two orcas added below the wafer and footer.')
